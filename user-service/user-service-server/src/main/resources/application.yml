server:
  port: 8102

spring:
  application:
    name: user-service
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://127.0.0.1:13306/volunteer_platform?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:change-me}
  cloud:
    nacos:
      discovery:
        server-addr: ${SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR:127.0.0.1:8848}

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

platform:
  jwt:
    secret: volunteer-platform-jwt-secret-2026
    ttl: 12h
  admin:
    user-id: 1
    account: admin
    password: ${PLATFORM_ADMIN_PASSWORD:change-me}
    username: admin
    user-type: MANAGER
  wechat:
    app-id: ${PLATFORM_WECHAT_APP_ID:}
    app-secret: ${PLATFORM_WECHAT_APP_SECRET:}
