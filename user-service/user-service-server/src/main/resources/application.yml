server:
  port: 8102

spring:
  application:
    name: user-service
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:13306}/volunteer_platform?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: change-me
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

platform:
  jwt:
    secret: ${JWT_SECRET:change-this-jwt-secret}
    ttl: 12h
  admin:
    user-id: 1
    account: admin
    password: Admin123456
    username: admin
    user-type: MANAGER
  wechat:
    app-id: your-wechat-miniapp-app-id
    app-secret: your-wechat-miniapp-app-secret
